name: Build All Platforms
run-name: OBS Clock installers ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'ci/**'
permissions:
  contents: read
concurrency:
  group: obs-clock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            container: null
          - platform: macos-arm64
            runner: macos-26
            container: null
          - platform: macos-x86_64
            runner: macos-26-intel
            container: null
          - platform: linux
            runner: ubuntu-26.04
            container: null
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 git ca-certificates pkg-config qt6-base-dev qt6-qpa-plugins libgl-dev libxkbcommon-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Install build tools
        if: runner.os != 'Linux'
        run: python -m pip install cmake==3.31.10 ninja==1.11.1.4
      - name: Installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Cache checksum verified downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-downloads
          key: clock-deps-${{ matrix.platform }}-${{ hashFiles('ci/dependencies.json') }}
      - name: Compile test and package
        run: python3 ci/native_build.py --platform ${{ matrix.platform }}
        if: runner.os != 'Windows'
      - name: Compile test and package Windows
        run: python ci/native_build.py --platform windows
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.platform }}
          path: packages/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: logs-${{ matrix.platform }}
          path: |
            out/**/Testing/Temporary/*.log
            out/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
  collect:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packages-*
          path: installers/
      - name: Check matching revisions and tests
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for platform in ('windows','macos-arm64','macos-x86_64','linux'):
              info=json.loads((Path('installers')/('packages-'+platform)/'BUILD-INFO.json').read_text())
              assert info['revision']==os.environ['EXPECTED_REVISION'],platform
              assert info['automated_tests']=='passed',platform
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OBS-Clock-AllPlatforms-${{ github.sha }}
          path: installers/
          if-no-files-found: error
          retention-days: 7
